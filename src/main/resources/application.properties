spring.application.name=ProdBackend
spring.profiles.active=dev
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

server.port=8080

springdoc.swagger-ui.path=/docs

jwt.access-token.expiration.ms=1200000
jwt.refresh-token.expiration.sec=604800

management.endpoints.web.exposure.include=health,prometheus

management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

management.endpoint.health.probes.enabled=true

management.endpoint.health.group.readiness.include=readinessState,db



# Photo inventory: optional external integration. Never store the API key in source control.
llm.proxy.api-key=${LLM_PROXY_API_KEY:}
llm.proxy.url=${LLM_PROXY_URL:https://llm-proxy.spirit.t-education.com/chat/completions}
llm.proxy.model=${LLM_PROXY_MODEL:openai/gpt-6-luna}
llm.proxy.connect-timeout-ms=${LLM_PROXY_CONNECT_TIMEOUT_MS:10000}
llm.proxy.timeout-ms=${LLM_PROXY_TIMEOUT_MS:120000}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

observability.metrics-token=${METRICS_SCRAPE_TOKEN:}
management.metrics.tags.application=movermate
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.movermate.llm.operation=true
management.metrics.tags.environment=${OBSERVABILITY_ENVIRONMENT:dev}
