spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=validate

server.forward-headers-strategy=framework

# Native Spring Boot structured logging; MDC and SLF4J key/value pairs are JSON fields.
logging.structured.format.console=logstash
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
management.metrics.tags.environment=${OBSERVABILITY_ENVIRONMENT:prod}
logging.level.org.hibernate.orm.jdbc.batch=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
