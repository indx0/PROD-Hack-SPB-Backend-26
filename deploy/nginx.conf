# Preserve the UUID shape used by the application's ErrorResponse.
map $request_id $photo_error_trace_id {
    "~^(........)(....)(....)(....)(............)$" "$1-$2-$3-$4-$5";
}

server {
    listen 80;
    server_name hack-lead-01-ru3-vm1-3a8de1.vmaas-spirit.t-education.com;

    location ~ ^/api/move-projects/[^/]+/ml/items?-description$ {
        client_max_body_size 11m;
        proxy_read_timeout 150s;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        error_page 413 = @photo_too_large;
    }

    location @photo_too_large {
        default_type application/json;
        return 413 '{"code":"IMAGE_TOO_LARGE","message":"Upload exceeds 11 MiB","traceId":"$photo_error_trace_id","time":"$time_iso8601"}';
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
