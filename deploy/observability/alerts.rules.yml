groups:
- name: movermate
  rules:
  - alert: MoverMateMetricsMissing
    expr: max(up{job="movermate",environment="prod"}) == 0 or absent(up{job="movermate",environment="prod"})
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: MoverMateMetricsMissing
  - alert: MoverMateApiErrors
    expr: (sum(increase(http_server_requests_seconds_count{application="movermate",environment="prod",uri=~"/api/.*",status=~"5.."}[5m]))
      / clamp_min(sum(increase(http_server_requests_seconds_count{application="movermate",environment="prod",uri=~"/api/.*"}[5m])),
      1)) > 0.05 and sum(increase(http_server_requests_seconds_count{application="movermate",environment="prod",uri=~"/api/.*"}[5m]))
      >= 20
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: MoverMateApiErrors
  - alert: MoverMateLlmErrors
    expr: (sum(increase(movermate_llm_operation_seconds_count{application="movermate",environment="prod",outcome=~"timeout|overload|upstream_error|invalid_response|unavailable|interrupted"}[5m]))
      / clamp_min(sum(increase(movermate_llm_operation_seconds_count{application="movermate",environment="prod"}[5m])),
      1)) > 0.20 and sum(increase(movermate_llm_operation_seconds_count{application="movermate",environment="prod"}[5m]))
      >= 10
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: MoverMateLlmErrors
  - alert: MoverMateLlmOverload
    expr: sum(increase(movermate_llm_overload_total{application="movermate",environment="prod"}[5m]))
      >= 3
    for: 0m
    labels:
      severity: warning
    annotations:
      summary: MoverMateLlmOverload
