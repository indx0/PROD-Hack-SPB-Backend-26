# Run Prometheus on the VM (host network). Store credentials outside the repository.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: movermate
    honor_labels: true
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/movermate-token
    static_configs:
      - targets: ['127.0.0.1:8080']
        labels:
          environment: prod
# For production forwarding, copy this file outside the repo and enable remote_write:
# remote_write:
#   - url: https://<SAGE_REMOTE_WRITE_ENDPOINT>
#     authorization:
#       type: JWT
#       credentials_file: /etc/prometheus/secrets/spirit-token
# Use the URL and authorization method supplied by your Sage administrator.
