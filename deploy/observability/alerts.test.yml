rule_files:
- alerts.rules.yml
evaluation_interval: 30s
tests:
- name: idle traffic is healthy
  interval: 1m
  input_series:
  - &id001
    series: up{job="movermate",environment="prod"}
    values: 1+0x10
  - series: http_server_requests_seconds_count{application="movermate",environment="prod",uri="/api/items",status="500"}
    values: 0+0x10
  - series: movermate_llm_operation_seconds_count{application="movermate",environment="prod",scenario="single",outcome="upstream_error"}
    values: 0+0x10
  - series: movermate_llm_overload_total{application="movermate",environment="prod",scenario="single"}
    values: 0+0x10
  alert_rule_test:
  - alertname: MoverMateMetricsMissing
    eval_time: 5m
    exp_alerts: []
  - alertname: MoverMateApiErrors
    eval_time: 5m
    exp_alerts: []
  - alertname: MoverMateLlmErrors
    eval_time: 5m
    exp_alerts: []
  - alertname: MoverMateLlmOverload
    eval_time: 5m
    exp_alerts: []
- name: low traffic does not page on error percentages
  interval: 1m
  input_series:
  - *id001
  - series: http_server_requests_seconds_count{application="movermate",environment="prod",uri="/api/items",status="500"}
    values: 0+1x10
  - series: movermate_llm_operation_seconds_count{application="movermate",environment="prod",scenario="single",outcome="upstream_error"}
    values: 0+1x10
  alert_rule_test:
  - alertname: MoverMateMetricsMissing
    eval_time: 5m
    exp_alerts: []
  - alertname: MoverMateApiErrors
    eval_time: 5m
    exp_alerts: []
  - alertname: MoverMateLlmErrors
    eval_time: 5m
    exp_alerts: []
  - alertname: MoverMateLlmOverload
    eval_time: 5m
    exp_alerts: []
- name: errors and overload cross thresholds
  interval: 1m
  input_series:
  - *id001
  - series: http_server_requests_seconds_count{application="movermate",environment="prod",uri="/api/items",status="200"}
    values: 0+80x10
  - series: http_server_requests_seconds_count{application="movermate",environment="prod",uri="/api/items",status="500"}
    values: 0+20x10
  - series: movermate_llm_operation_seconds_count{application="movermate",environment="prod",scenario="single",outcome="success"}
    values: 0+70x10
  - series: movermate_llm_operation_seconds_count{application="movermate",environment="prod",scenario="single",outcome="upstream_error"}
    values: 0+30x10
  - series: movermate_llm_overload_total{application="movermate",environment="prod",scenario="single"}
    values: 0+1x10
  alert_rule_test:
  - alertname: MoverMateApiErrors
    eval_time: 5m
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: MoverMateApiErrors
  - alertname: MoverMateLlmErrors
    eval_time: 5m
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: MoverMateLlmErrors
  - alertname: MoverMateLlmOverload
    eval_time: 5m
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: MoverMateLlmOverload
- name: absent target must remain missing for two minutes
  interval: 1m
  input_series: []
  alert_rule_test:
  - alertname: MoverMateMetricsMissing
    eval_time: 1m
    exp_alerts: []
  - alertname: MoverMateMetricsMissing
    eval_time: 2m
    exp_alerts:
    - exp_labels:
        severity: warning
        job: movermate
        environment: prod
      exp_annotations:
        summary: MoverMateMetricsMissing
- name: unreachable target fires
  interval: 1m
  input_series:
  - series: up{job="movermate",environment="prod"}
    values: 0+0x10
  alert_rule_test:
  - alertname: MoverMateMetricsMissing
    eval_time: 2m
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations:
        summary: MoverMateMetricsMissing
