# Run Vector on the Docker host, with read access to its Docker API.
data_dir = "/var/lib/vector"

[sources.app]
type = "docker_logs"
include_labels = ["com.docker.compose.project=prod-backend", "com.docker.compose.service=app"]

[transforms.safe_events]
type = "remap"
inputs = ["app"]
drop_on_error = true
drop_on_abort = true
source = '''
event = parse_json!(string!(.message))
if !includes(["http_request_completed", "llm_operation_completed", "llm_operation_error"], event.event) { abort }
# Explicit allowlist: never forward Docker metadata, arbitrary messages or stack traces.
. = {
  "@timestamp": event."@timestamp",
  "env": "prod",
  "system": "movermate",
  "inst": "${SAGE_INSTANCE}",
  "level": event.level,
  "event": event.event,
  "requestId": event.requestId,
  "method": event.method,
  "route": event.route,
  "status": event.status,
  "durationMs": event.durationMs,
  "scenario": event.scenario,
  "outcome": event.outcome,
  "code": event.code,
  "traceId": event.traceId
}
'''

[sinks.sage]
type = "http"
inputs = ["safe_events"]
uri = "${SAGE_LOGS_URL}/api/${SAGE_GROUP}/multiline/"
method = "post"
healthcheck.enabled = false
framing.method = "newline_delimited"
encoding.codec = "json"
request.headers.Authorization = "JWT ${SPIRIT_API_TOKEN}"
batch.max_events = 100
batch.timeout_secs = 1
buffer.type = "disk"
buffer.max_size = 268435488
buffer.when_full = "drop_newest"

[[tests]]
name = "technical event preserves correlation and drops secrets"
[[tests.inputs]]
insert_at = "safe_events"
type = "log"
[tests.inputs.log_fields]
message = '{"@timestamp":"2026-10-17T10:00:00Z","event":"http_request_completed","level":"INFO","requestId":"request-1","route":"/api/items/{id}","status":401,"durationMs":2,"Authorization":"secret","message":"private body","stack_trace":"private SQL"}'
[[tests.outputs]]
extract_from = "safe_events"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.requestId, "request-1")
assert_eq!(.status, 401)
assert_eq!(.env, "prod")
assert_eq!(.system, "movermate")
assert!(!exists(.Authorization))
assert!(!exists(.message))
assert!(!exists(.stack_trace))
'''

[[tests]]
name = "unstructured and unrelated logs are not forwarded"
no_outputs_from = ["safe_events"]
[[tests.inputs]]
insert_at = "safe_events"
type = "log"
[tests.inputs.log_fields]
message = '{"message":"arbitrary framework error with SQL data"}'

[[tests]]
name = "non JSON output is discarded"
no_outputs_from = ["safe_events"]
[[tests.inputs]]
insert_at = "safe_events"
type = "log"
[tests.inputs.log_fields]
message = 'private non JSON framework output'
