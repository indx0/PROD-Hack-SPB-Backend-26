# This file is auto-generated by DevPlatform for further customizing as you wish.
# NOTE: You should not delete this file!

include:
  - project: pipelines/pipelines
    ref: master
    file:
      - /jobs/build.yaml
      - /jobs/teleport.yaml

variables:
  APP_IMAGE: "registry.spirit.t-education.com/${CI_PROJECT_PATH}:${CI_COMMIT_SHA}"
  DEPLOY_SSH_USER: root
  DEPLOY_VM: hack-lead-01-ru3-vm1-3a8de1
  PUBLIC_BASE_URL: https://hack-lead-01-ru3-vm1-3a8de1.vmaas-spirit.t-education.com

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - test
  - build
  - deploy

test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  interruptible: true
  timeout: 20m

  services:
    - name: postgres:17-alpine
      alias: postgres

  variables:
    POSTGRES_DB: prod_backend_test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test-ci-only
    TEST_DATABASE_EXTERNAL: "true"
    TEST_DB_URL: jdbc:postgresql://postgres:5432/prod_backend_test
    TEST_DB_USERNAME: test
    TEST_DB_PASSWORD: test-ci-only
    MAVEN_OPTS: "-Xmx512m"

  cache:
    key: maven-java17
    paths:
      - .m2/repository/

  script:
    - mvn -B -ntp -Dmaven.repo.local="$CI_PROJECT_DIR/.m2/repository" clean verify

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - target/surefire-reports/
      - target/failsafe-reports/
      - target/site/jacoco-unit/
      - target/site/jacoco-integration/
      - target/site/jacoco/
      - target/*.jar
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
        - target/failsafe-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml

build-image:
  extends: .dp_build
  stage: build
  needs:
    - job: test
      artifacts: true
  variables:
    IMAGE_NAME: "$APP_IMAGE"
    KANIKO_CACHE: "false"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:
  extends: .teleport_auth
  stage: deploy
  image: registry.spirit.t-education.com/cicd-images/tsh-18:latest
  variables:
    DOCKER_CONFIG: "$CI_PROJECT_DIR/.deploy-docker"
  needs:
    - job: build-image
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  resource_group: prod-backend-production
  interruptible: false
  environment:
    name: production
    url: $PUBLIC_BASE_URL
  script:
    - mkdir -p "$DOCKER_CONFIG"
    - dp auth configure-kaniko
    - test -s "$DOCKER_CONFIG/config.json"
    - DEPLOY_TARGET="${DEPLOY_SSH_USER}@${DEPLOY_VM}"
    - tsh ssh "$DEPLOY_TARGET" 'install -d -m 0750 /opt/prod-backend && install -d -m 0700 /opt/prod-backend/.ci-docker'
    - tsh scp compose.prod.yaml "${DEPLOY_TARGET}:/opt/prod-backend/compose.prod.yaml"
    - tsh scp scripts/deploy.sh "${DEPLOY_TARGET}:/opt/prod-backend/deploy.sh"
    - tsh scp "$DOCKER_CONFIG/config.json" "${DEPLOY_TARGET}:/opt/prod-backend/.ci-docker/config.json"
    - tsh ssh "$DEPLOY_TARGET" "bash /opt/prod-backend/deploy.sh '$APP_IMAGE'"
    - curl --fail --silent --show-error --max-time 30 --retry 5 --retry-delay 3 --retry-all-errors "$PUBLIC_BASE_URL/actuator/health/readiness"
    - curl --fail --silent --show-error --max-time 30 --retry 5 --retry-delay 3 --retry-all-errors --output /dev/null "$PUBLIC_BASE_URL/v3/api-docs"
  after_script:
    - rm -f "$DOCKER_CONFIG/config.json"
