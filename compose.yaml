services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prod_backend
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    image: prod-backend:local
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      OBSERVABILITY_ENVIRONMENT: ${OBSERVABILITY_ENVIRONMENT:-prod}
      LLM_PROXY_API_KEY: ${LLM_PROXY_API_KEY:-}
      LLM_PROXY_URL: ${LLM_PROXY_URL:-https://llm-proxy.spirit.t-education.com/chat/completions}
      LLM_PROXY_MODEL: ${LLM_PROXY_MODEL:-openai/gpt-6-luna}
      LLM_PROXY_CONNECT_TIMEOUT_MS: ${LLM_PROXY_CONNECT_TIMEOUT_MS:-10000}
      LLM_PROXY_TIMEOUT_MS: ${LLM_PROXY_TIMEOUT_MS:-120000}
      ML_RATE_LIMIT_MAX_REQUESTS: ${ML_RATE_LIMIT_MAX_REQUESTS:-15}
      ML_RATE_LIMIT_WINDOW_SECONDS: ${ML_RATE_LIMIT_WINDOW_SECONDS:-60}
      DB_URL: jdbc:postgresql://postgres:5432/prod_backend
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  postgres_data:
